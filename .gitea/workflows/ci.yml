name: CI/CD

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: https://github.com/actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run lint
      run: |
        python3 -m black --check . || echo "Black format check failed"
        python3 -m isort --check-only . || echo "Import order check failed"

    - name: Run unit tests
      run: |
        python3 -m pytest tests/unit/ -v --tb=short

    - name: Run integration tests
      run: |
        python3 -m pytest tests/integration/ -v --tb=short

    - name: Run performance tests
      run: |
        python3 -m pytest tests/performance/ -v --tb=short

    - name: Run E2E tests
      run: |
        python3 -m pytest tests/e2e/ -v --tb=short

    - name: Generate coverage report
      run: |
        python3 -m pytest tests/ --cov=. --cov-report=xml --cov-report=html

    - name: Check coverage threshold
      run: |
        python3 -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        coverage = float(tree.find('.coverage').attrib['line-rate'])
        threshold = 0.70
        if coverage < threshold:
            print(f'Coverage {coverage*100:.2f}% is below threshold {threshold*100}%')
            exit(1)
        print(f'Coverage {coverage*100:.2f}% meets threshold {threshold*100}%')
        "

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@v4

    - name: Set up Python
      uses: https://github.com/actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy pylint

    - name: Check code formatting with Black
      run: |
        black --check .

    - name: Check import order with isort
      run: |
        isort --check-only .

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@v4

    - name: Set up Python
      uses: https://github.com/actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build package
      run: |
        python3 -m build

    - name: Upload artifacts
      uses: https://github.com/actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: https://github.com/actions/checkout@v4

    - name: Download artifacts
      uses: https://github.com/actions/download-artifact@v3
      with:
        name: dist

    - name: Deploy to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        pip install twine
        twine upload dist/*
