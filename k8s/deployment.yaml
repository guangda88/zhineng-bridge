apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhineng-bridge
  namespace: zhineng-bridge
  labels:
    app.kubernetes.io/name: zhineng-bridge
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/component: relay-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zhineng-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhineng-bridge
        app.kubernetes.io/version: "1.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: zhineng-bridge
          image: zhineng-bridge:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8765
              protocol: TCP
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: zhineng-bridge-config
            - secretRef:
                name: zhineng-bridge-secrets
                optional: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/zhineng-bridge
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["python3", "-c", "import signal, os; os.kill(os.getpid(), signal.SIGTERM)"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
