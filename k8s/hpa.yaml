apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zhineng-bridge-pdb
  namespace: zhineng-bridge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zhineng-bridge
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zhineng-bridge-hpa
  namespace: zhineng-bridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zhineng-bridge
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
