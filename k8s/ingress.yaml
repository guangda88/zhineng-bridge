apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zhineng-bridge
  namespace: zhineng-bridge
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "zhineng-bridge-ws"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bridge.example.com
      secretName: zhineng-bridge-tls
  rules:
    - host: bridge.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: zhineng-bridge-ws
                port:
                  number: 8765
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: zhineng-bridge-http
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: zhineng-bridge-http
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: zhineng-bridge-http
                port:
                  number: 8000
