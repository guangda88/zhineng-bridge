# ============================================================================
# 智桥 (Zhineng-bridge) Nginx 反向代理配置
# ============================================================================
# 此配置提供:
# - WebSocket 代理支持
# - SSL/TLS 终止
# - 速率限制
# - 安全头
# - Gzip 压缩
# - 请求日志记录
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format websocket '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'upgrade="$http_upgrade" connection="$connection"';

    access_log /var/log/nginx/access.log main;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # 缓冲区配置
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # 速率限制配置
    # 每个 IP 地址限制 10 个请求/秒 (burst 20)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    # WebSocket 连接限制 (5 个连接/秒)
    limit_req_zone $binary_remote_addr zone=websocket_limit:10m rate=5r/s;
    # 并发连接限制
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 上游服务器配置
    upstream zhineng_bridge_backend {
        # 主应用服务器
        server zhineng-bridge:8765 max_fails=3 fail_timeout=30s;
        # 可以添加更多服务器实现负载均衡
        # server zhineng-bridge-2:8765 max_fails=3 fail_timeout=30s;

        keepalive 64;
    }

    upstream zhineng_bridge_http {
        # HTTP 服务器 (健康检查、OAuth2 回调)
        server zhineng-bridge:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================================
    # HTTP Server (重定向到 HTTPS)
    # ============================================================================
    server {
        listen 80;
        server_name _;

        # 允许 Let's Encrypt ACME 挑战
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他所有请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================================
    # HTTPS Server (生产环境)
    # ============================================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书配置
        # 使用 Let's Encrypt 证书或自定义证书
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL 协议和加密套件配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL 会话配置
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;

        # WebSocket 连接限制 (最多 100 个并发连接)
        limit_conn conn_limit 100;

        # ============================================================================
        # WebSocket 代理 (主功能)
        # ============================================================================
        location / {
            # 速率限制
            limit_req zone=websocket_limit burst=10 nodelay;

            # WebSocket 升级配置
            proxy_pass http://zhineng_bridge_backend;
            proxy_http_version 1.1;

            # 关键的 WebSocket 头部
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # 缓冲区禁用（对 WebSocket 很重要）
            proxy_buffering off;
            proxy_cache off;

            # 日志
            access_log /var/log/nginx/websocket_access.log websocket;
        }

        # ============================================================================
        # HTTP 服务器代理 (健康检查、OAuth2 回调、API 文档)
        # ============================================================================
        location /health {
            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 不记录健康检查日志
            access_log off;
        }

        location /metrics {
            # 速率限制
            limit_req zone=general_limit burst=5 nodelay;

            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 日志
            access_log /var/log/nginx/metrics_access.log main;
        }

        location /docs {
            # 速率限制
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2 {
            # OAuth2 回调端点
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================================
        # Prometheus 代理 (可选，如果需要从外部访问)
        # ============================================================================
        location /prometheus/ {
            # 强制基本认证 (可选，但推荐)
            # auth_basic "Prometheus Restricted";
            # auth_basic_user_file /etc/nginx/.htpasswd;

            limit_req zone=general_limit burst=5 nodelay;

            proxy_pass http://prometheus:9090/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 日志
            access_log /var/log/nginx/prometheus_access.log main;
        }

        # ============================================================================
        # Grafana 代理 (可选，如果需要从外部访问)
        # ============================================================================
        location /grafana/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://grafana:3000/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持 (Grafana Live)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 日志
            access_log /var/log/nginx/grafana_access.log main;
        }

        # ============================================================================
        # 静态文件服务 (Web UI)
        # ============================================================================
        location /web/ {
            alias /app/web/;
            index index.html;
            try_files $uri $uri/ /web/index.html;

            # 缓存配置
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # ============================================================================
        # Nginx 状态页面 (仅用于监控)
        # ============================================================================
        location /nginx_status {
            stub_status on;
            access_log off;
            # 仅允许本地访问
            allow 127.0.0.1;
            deny all;
        }

        # ============================================================================
        # 禁止访问隐藏文件
        # ============================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ============================================================================
        # 自定义错误页面
        # ============================================================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ============================================================================
    # Stream 模块 (TCP/UDP 代理 - 可选)
    # ============================================================================
    # 如果需要 TCP 层面的代理，取消下面的注释
    #
    # stream {
    #     upstream websocket_tcp {
    #         server zhineng-bridge:8765;
    #     }
    #
    #     server {
    #         listen 8765 ssl;
    #         ssl_certificate /etc/nginx/ssl/cert.pem;
    #         ssl_certificate_key /etc/nginx/ssl/key.pem;
    #         ssl_protocols TLSv1.2 TLSv1.3;
    #
    #         proxy_pass websocket_tcp;
    #     }
    # }
}
