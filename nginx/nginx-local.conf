# ============================================================================
# 智桥 (Zhineng-bridge) 本地开发 Nginx 配置
# ============================================================================
# 用于本地HTTPS测试，支持内网WebSocket访问
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    log_format websocket '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_user_agent" upgrade="$http_upgrade"';

    access_log /var/log/nginx/access.log main;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;
    gzip_disable "msie6";

    # 缓冲区配置
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # 上游服务器配置
    upstream zhineng_bridge_backend {
        server 127.0.0.1:8765 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream zhineng_bridge_http {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================================
    # HTTP Server (重定向到 HTTPS)
    # ============================================================================
    server {
        listen 80;
        server_name localhost 10.113.22.99 100.66.1.8 192.168.2.1;

        # 允许 Let's Encrypt ACME 挑战
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================================
    # HTTPS Server (本地开发)
    # ============================================================================
    server {
        listen 443 ssl http2;
        server_name localhost 10.113.22.99 100.66.1.8 192.168.2.1;

        # SSL 证书配置（自签名证书）
        ssl_certificate /home/ai/zhineng-bridge/nginx/ssl/cert.pem;
        ssl_certificate_key /home/ai/zhineng-bridge/nginx/ssl/key.pem;

        # SSL 协议和加密套件
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL 会话配置
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ============================================================================
        # WebSocket 代理
        # ============================================================================
        location / {
            # WebSocket 升级配置
            proxy_pass http://zhineng_bridge_backend;
            proxy_http_version 1.1;

            # 关键的 WebSocket 头部
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # 缓冲区禁用（对 WebSocket 很重要）
            proxy_buffering off;
            proxy_cache off;

            # 日志
            access_log /var/log/nginx/websocket_access.log websocket;
        }

        # ============================================================================
        # HTTP 服务器代理
        # ============================================================================
        location /health {
            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        location /metrics {
            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log /var/log/nginx/metrics_access.log main;
        }

        location /docs {
            proxy_pass http://zhineng_bridge_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================================================
        # 静态文件服务 (Web UI)
        # ============================================================================
        location /web/ {
            alias /home/ai/zhineng-bridge/web/ui/;
            index index.html;
            try_files $uri $uri/ /web/index.html;

            # 缓存配置
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # ============================================================================
        # 禁止访问隐藏文件
        # ============================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ============================================================================
        # 自定义错误页面
        # ============================================================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 200 '{"error": "Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
