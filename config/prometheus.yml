# Prometheus Configuration for Zhineng-bridge
# This configuration tells Prometheus where to scrape metrics from

global:
  scrape_interval: 15s  # Scrape every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - localhost:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config
  - job_name: 'zhineng-bridge'

    # How frequently to scrape targets from this job
    scrape_interval: 10s

    # HTTP path to scrape metrics from
    metrics_path: '/prometheus'

    # List of targets to scrape
    static_configs:
      - targets:
          - 'localhost:8000'  # Health check server port

    # Optional: labels added to all time series
    labels:
      service: 'zhineng-bridge'
      environment: 'development'

  # Optional: Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Optional: Scrape Node Exporter for system metrics
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']
