[common]
# 服务器地址（需要用户提供）
server_addr = frp.example.com
server_port = 7000

# 认证令牌（需要用户提供）
token = your_frp_token_here

# 客户端ID（可选）
user = zhineng-bridge

[zhineng_bridge_http]
type = tcp
local_ip = 127.0.0.1
local_port = 8080
remote_port = 8080
# 公网访问地址: http://frp.example.com:8080

[zhineng_bridge_https]
type = tcp
local_ip = 127.0.0.1
local_port = 443
remote_port = 443
# 公网访问地址: https://frp.example.com:443

[zhineng_bridge_websocket]
type = tcp
local_ip = 127.0.0.1
local_port = 8765
remote_port = 8765
# 公网WebSocket地址: ws://frp.example.com:8765
# 或 wss://frp.example.com:443 (通过nginx代理)

[zhineng_bridge_prometheus]
type = tcp
local_ip = 127.0.0.1
local_port = 9090
remote_port = 9090
# Prometheus监控: http://frp.example.com:9090

[zhineng_bridge_grafana]
type = tcp
local_ip = 127.0.0.1
local_port = 3000
remote_port = 3000
# Grafana仪表板: http://frp.example.com:3000
