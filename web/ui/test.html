<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试页面</title>
</head>
<body>
    <h1>JavaScript 加载测试</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            output.appendChild(div);
            console.log(msg);
        }

        log('开始测试...');

        // 测试配置
        if (window.ZHINENG_BRIDGE_CONFIG) {
            log('✅ ZHINENG_BRIDGE_CONFIG 已加载');
            log(`  WebSocket URL: ws://${window.ZHINENG_BRIDGE_CONFIG.WS_HOST}:${window.ZHINENG_BRIDGE_CONFIG.WS_PORT}`);
        } else {
            log('❌ ZHINENG_BRIDGE_CONFIG 未加载');
        }

        // 测试全局变量
        if (window.APP_STATE) {
            log('✅ APP_STATE 已加载');
            log(`  当前页面: ${window.APP_STATE.currentPage}`);
            log(`  连接状态: ${window.APP_STATE.isConnected ? '已连接' : '未连接'}`);
        } else {
            log('❌ APP_STATE 未加载');
        }

        if (window.TOOLS) {
            log(`✅ TOOLS 已加载 (${window.TOOLS.length} 个工具)`);
        } else {
            log('❌ TOOLS 未加载');
        }

        if (window.SESSIONS) {
            log(`✅ SESSIONS 已加载 (${window.SESSIONS.length} 个会话)`);
        } else {
            log('❌ SESSIONS 未加载');
        }

        // 测试函数
        const functions = [
            'renderTools',
            'renderSessions',
            'newSession',
            'refreshSessions',
            'connectWebSocket',
            'handleMessage',
            'handleSessionStarted',
            'handleSessionStopped',
            'handleSessionsList',
            'handleOutput',
            'handleCommandSent',
            'showNotification',
            'verifyToolAvailability'
        ];

        let missingFunctions = [];
        functions.forEach(fn => {
            if (window[fn]) {
                log(`✅ ${fn} 已加载`);
            } else {
                log(`❌ ${fn} 未加载`);
                missingFunctions.push(fn);
            }
        });

        // 测试WebSocket连接
        log('测试 WebSocket 连接...');
        try {
            const ws = new WebSocket(`ws://${window.ZHINENG_BRIDGE_CONFIG.WS_HOST}:${window.ZHINENG_BRIDGE_CONFIG.WS_PORT}`);

            ws.onopen = () => {
                log('✅ WebSocket 连接成功');
                ws.send(JSON.stringify({ type: 'ping' }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'pong') {
                    log('✅ 收到 pong 响应');
                    ws.close();
                }
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket 错误: ${error}`);
            };

            ws.onclose = () => {
                log('WebSocket 连接已关闭');
            };
        } catch (error) {
            log(`❌ WebSocket 连接失败: ${error.message}`);
        }

        // 总结
        log('\n' + '='.repeat(50));
        if (missingFunctions.length === 0) {
            log('✅ 所有函数都已成功加载！');
        } else {
            log(`❌ ${missingFunctions.length} 个函数缺失: ${missingFunctions.join(', ')}`);
        }
    </script>
</body>
</html>
