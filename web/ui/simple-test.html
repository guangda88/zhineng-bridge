<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试</title>
    <style>
        .page { display: none; }
        .page.active { display: block; }
        .nav-item { margin: 10px; padding: 10px; cursor: pointer; border: 1px solid #ccc; }
        .nav-item.active { background: #007bff; color: white; }
        button { margin: 5px; padding: 10px 20px; }
        #output { margin: 20px 0; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>简单测试页面</h1>

    <nav>
        <div class="nav-item active" data-page="tools">工具</div>
        <div class="nav-item" data-page="sessions">会话</div>
        <div class="nav-item" data-page="settings">设置</div>
    </nav>

    <div id="output"></div>

    <div id="tools" class="page active">
        <h2>工具页面</h2>
    </div>

    <div id="sessions" class="page">
        <h2>会话页面</h2>
        <button id="newSessionBtn">新建会话</button>
        <button id="refreshSessionsBtn">刷新</button>
    </div>

    <div id="settings" class="page">
        <h2>设置页面</h2>
    </div>

    <script>
        const output = document.getElementById('output');

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.insertBefore(div, output.firstChild);
            console.log(msg);
        }

        log('页面加载完成');

        // 导航测试
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.getAttribute('data-page');
                log(`点击导航: ${page}`);

                // 切换页面
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(page).classList.add('active');

                // 切换导航状态
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                log(`已切换到: ${page}`);
            });
        });

        // 按钮测试
        document.getElementById('newSessionBtn').addEventListener('click', () => {
            log('点击新建会话按钮');
        });

        document.getElementById('refreshSessionsBtn').addEventListener('click', () => {
            log('点击刷新按钮');
        });

        log('所有事件监听器已绑定');
    </script>
</body>
</html>
