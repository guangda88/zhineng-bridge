version: '3.8'

services:
  # 主应用服务
  zhineng-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhineng-bridge-prod
    ports:
      - "8000:8000"   # HTTP Server
      - "8765:8765"   # WebSocket Relay Server
    environment:
      # Server Configuration
      - ZHINENG_BRIDGE_HOST=0.0.0.0
      - ZHINENG_BRIDGE_PORT=8765
      - ZHINENG_BRIDGE_MAX_CONNECTIONS=500
      - ZHINENG_BRIDGE_SESSION_TIMEOUT=7200
      - ZHINENG_BRIDGE_MAX_SESSIONS=200
      - ZHINENG_BRIDGE_PING_INTERVAL=30
      - ZHINENG_BRIDGE_PING_TIMEOUT=15

      # Logging Configuration
      - ZHINENG_BRIDGE_LOG_LEVEL=INFO
      - ZHINENG_BRIDGE_LOG_FORMAT=json
      - ZHINENG_BRIDGE_LOG_FILE=/var/log/zhineng-bridge/relay-server.log

      # Security Configuration
      - ZHINENG_BRIDGE_SECURITY_ENABLE_AUTH=true
      - ZHINENG_BRIDGE_SECURITY_AUTH_TYPE=token
      - ZHINENG_BRIDGE_SECURITY_ENABLE_RATE_LIMIT=true
      - ZHINENG_BRIDGE_SECURITY_RATE_LIMIT_PER_MINUTE=120
      - ZHINENG_BRIDGE_SECURITY_RATE_LIMIT_PER_HOUR=2000
      - ZHINENG_BRIDGE_SECURITY_SECRET_KEY=${ZHINENG_BRIDGE_SECURITY_SECRET_KEY}

      # WSS Configuration (enable if SSL certificates are available)
      - ZHINENG_BRIDGE_ENABLE_WSS=${ZHINENG_BRIDGE_ENABLE_WSS:-false}
      - ZHINENG_BRIDGE_CERT_FILE=/app/certs/cert.pem
      - ZHINENG_BRIDGE_KEY_FILE=/app/certs/key.pem

      # Monitoring Configuration
      - ZHINENG_BRIDGE_MONITORING_ENABLE_HEALTH_CHECK=true
      - ZHINENG_BRIDGE_MONITORING_ENABLE_PERFORMANCE_MONITORING=true
      - ZHINENG_BRIDGE_MONITORING_ENABLE_PROMETHEUS=true

      # Database Configuration
      - ZHINENG_BRIDGE_DB_ENABLE_SQLITE=false
      - ZHINENG_BRIDGE_DB_PG_HOST=postgres
      - ZHINENG_BRIDGE_DB_PG_PORT=5432
      - ZHINENG_BRIDGE_DB_PG_DATABASE=zhineng_bridge
      - ZHINENG_BRIDGE_DB_PG_USER=${POSTGRES_USER}
      - ZHINENG_BRIDGE_DB_PG_PASSWORD=${POSTGRES_PASSWORD}

      # Python Environment
      - PYTHONUNBUFFERED=1
    volumes:
      # Log volume
      - zhineng-bridge-logs:/var/log/zhineng-bridge
      # SSL Certificates volume (if using WSS)
      - ./certs:/app/certs:ro
      # Database persistence volume
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zhineng-bridge-net
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zhineng-bridge-postgres-prod
    environment:
      - POSTGRES_DB=zhineng_bridge
      - POSTGRES_USER=${POSTGRES_USER:-zhineng}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zhineng-bridge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhineng} -d zhineng_bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis for caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: zhineng-bridge-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zhineng-bridge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: zhineng-bridge-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - zhineng-bridge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: zhineng-bridge-grafana-prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
    networks:
      - zhineng-bridge-net
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Nginx Reverse Proxy (optional, for SSL termination and load balancing)
  nginx:
    image: nginx:alpine
    container_name: zhineng-bridge-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - zhineng-bridge-net
    depends_on:
      - zhineng-bridge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  zhineng-bridge-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  zhineng-bridge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
